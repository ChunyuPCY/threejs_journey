packages:
  - apps/*
  - packages/*

# One place to pin versions shared by every package.
# Reference them with "catalog:" in a package.json.
catalog:
  '@tailwindcss/vite': ^4.3.5
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@types/three': ^0.187.0
  '@vitejs/plugin-react': ^6.3.0
  lil-gui: ^0.21.0
  react: ^19.3.1
  react-dom: ^19.3.1
  react-router: ^8.5.2
  tailwindcss: ^4.3.5
  three: ^0.187.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vite-plus: 1.8.0
overrides:
  vite@*: 'catalog:'
ignoreWorkspaceRootCheck: true
linkWorkspacePackages: true
